name: Houji Experience

on:
  workflow_call:
    inputs:
      kernel_artifact_name:
        description: Exact AnyKernel3 artifact from this kernel job in this run
        type: string
        required: false
        default: ''
      artifact_name:
        type: string
        required: false
        default: HNHouji-Experience-preview
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: 'Existing successful kernel run ID to package a paired module'
        type: string
        required: true
      kernel_artifact_name:
        description: 'Exact AnyKernel3 artifact in kernel_run_id (both inputs required for pairing)'
        type: string
        required: true
  pull_request:
    paths:
      - 'modules/houji-experience/**'
      - '.github/workflows/houji-experience.yml'
      - 'scripts/write-houji-kernel-manifest.py'
      - 'scripts/collect-houji-experience.py'
      - 'scripts/customize-anykernel3.sh'
      - '.github/workflows/build.yml'
      - '.github/workflows/main.yml'
      - '.github/actions/build-kernel/action.yml'
      - '.github/actions/susfs-patches/action.yml'
      - '.github/actions/susfs-revert-patches/action.yml'
      - '.github/scripts/susfs_namespace_header.py'
  push:
    paths:
      - 'modules/houji-experience/**'
      - '.github/workflows/houji-experience.yml'
      - 'scripts/write-houji-kernel-manifest.py'
      - 'scripts/collect-houji-experience.py'
      - 'scripts/customize-anykernel3.sh'
      - '.github/workflows/build.yml'
      - '.github/workflows/main.yml'
      - '.github/actions/build-kernel/action.yml'
      - '.github/actions/susfs-patches/action.yml'
      - '.github/actions/susfs-revert-patches/action.yml'
      - '.github/scripts/susfs_namespace_header.py'

permissions:
  contents: read
  actions: read

jobs:
  module:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: modules/houji-experience
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v7
      - name: Require a kernel artifact outside generic QA
        env:
          BUILD_EVENT: ${{ github.event_name }}
          KERNEL_ARTIFACT: ${{ inputs.kernel_artifact_name }}
        run: |
          set -euo pipefail
          case "$BUILD_EVENT" in
            push|pull_request) ;;
            *) [ -n "$KERNEL_ARTIFACT" ] || { echo 'Select the exact kernel artifact for a paired module'; exit 1; } ;;
          esac
      - name: Download this kernel's build metadata
        if: (inputs.kernel_run_id == '' || inputs.kernel_run_id == null) && inputs.kernel_artifact_name != '' && inputs.kernel_artifact_name != null
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.kernel_artifact_name }}
          path: ${{ runner.temp }}/houji-kernel-artifact
      - name: Download selected existing kernel for paired module
        if: inputs.kernel_run_id != '' && inputs.kernel_run_id != null
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KERNEL_RUN_ID: ${{ inputs.kernel_run_id }}
          KERNEL_ARTIFACT: ${{ inputs.kernel_artifact_name }}
          KERNEL_DEST: ${{ runner.temp }}/houji-kernel-artifact
        run: |
          set -euo pipefail
          [[ "$KERNEL_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid/missing kernel run ID'; exit 1; }
          [ -n "$KERNEL_ARTIFACT" ] || { echo 'Missing exact kernel artifact name'; exit 1; }
          [ "$(gh run view "$KERNEL_RUN_ID" --repo "$GH_REPO" --json conclusion --jq .conclusion)" = success ] || { echo 'Kernel run must have succeeded'; exit 1; }
          gh run download "$KERNEL_RUN_ID" --repo "$GH_REPO" --name "$KERNEL_ARTIFACT" --dir "$KERNEL_DEST"
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install pinned frontend tools
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Test backend and scripts
        run: |
          go test -race ./...
          go vet ./...
          for script in ./*.sh tools/*.sh; do bash -n "$script"; done
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck -s sh customize.sh service.sh uninstall.sh
          shellcheck tools/build-android.sh
      - name: Build and test WebUI
        run: |
          pnpm build
          pnpm test
          pnpm exec playwright install --with-deps chromium
          pnpm test:browser
      - name: Build Android arm64 with Bionic DNS
        env:
          KERNEL_ARTIFACT: ${{ inputs.kernel_artifact_name }}
          KERNEL_MANIFEST: ${{ runner.temp }}/houji-kernel-artifact/houji-kernel.json
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;28.1.13356709'
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.1.13356709" bash tools/build-android.sh
          python3 tools/collect-licenses.py
          if [ -n "$KERNEL_ARTIFACT" ]; then
            python3 tools/package.py --kernel-manifest "$KERNEL_MANIFEST" --kernel-artifact "$KERNEL_ARTIFACT" --kernel-image "$(dirname "$KERNEL_MANIFEST")/Image"
          else
            python3 tools/package.py
          fi
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Upload installable module ZIP without an outer archive
        id: installable
        uses: actions/upload-artifact@v7
        with:
          path: modules/houji-experience/dist/*.zip
          archive: false
          if-no-files-found: error
      - name: Upload build files for collectors (extract before installing)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name || 'HNHouji-Experience-build-files-extract-first' }}
          path: |
            modules/houji-experience/dist/*.zip
            modules/houji-experience/dist/*.sha256
            modules/houji-experience/dist/*.manifest.json
          if-no-files-found: error
      - name: Show module installation download
        env:
          INSTALLABLE_URL: ${{ steps.installable.outputs.artifact-url }}
          KERNEL_ARTIFACT: ${{ inputs.kernel_artifact_name }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Cài HNHouji Experience bằng KernelSU Next
          [Tải ZIP module để cài trực tiếp]($INSTALLABLE_URL)

          Artifact build-files là gói chứa ZIP/checksum/manifest: phải giải nén trước, không chọn gói đó để flash.
          EOF
          if [ -n "$KERNEL_ARTIFACT" ]; then
            echo 'Bản paired có metadata nhúng: chọn ZIP -for-<kernel>-<hash>. Sau reboot, kiểm tra kernel_sync.ready=true.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Bản generic (-generic.zip) không có metadata nhúng. Cần sidecar kernel hợp lệ; nếu thiếu, module chỉ chẩn đoán. Để dùng thường ngày, chạy workflow thủ công với đúng kernel run/artifact.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload browser QA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name || 'HNHouji-Experience-preview' }}-webui-qa
          path: |
            modules/houji-experience/dist/screenshots/
            modules/houji-experience/test-results/
          if-no-files-found: ignore

name: Houji Experience

on:
  workflow_call:
    inputs:
      kernel_artifact_name:
        description: Exact AnyKernel3 artifact from this kernel job in this run
        type: string
        required: false
        default: ''
      artifact_name:
        type: string
        required: false
        default: HNHouji-Experience-preview
  workflow_dispatch:
  pull_request:
    paths:
      - 'modules/houji-experience/**'
      - '.github/workflows/houji-experience.yml'
      - 'scripts/write-houji-kernel-manifest.py'
      - 'scripts/collect-houji-experience.py'
      - 'scripts/customize-anykernel3.sh'
      - '.github/workflows/build.yml'
      - '.github/workflows/main.yml'
      - '.github/actions/build-kernel/action.yml'
      - '.github/actions/susfs-patches/action.yml'
      - '.github/actions/susfs-revert-patches/action.yml'
      - '.github/scripts/susfs_namespace_header.py'
  push:
    paths:
      - 'modules/houji-experience/**'
      - '.github/workflows/houji-experience.yml'
      - 'scripts/write-houji-kernel-manifest.py'
      - 'scripts/collect-houji-experience.py'
      - 'scripts/customize-anykernel3.sh'
      - '.github/workflows/build.yml'
      - '.github/workflows/main.yml'
      - '.github/actions/build-kernel/action.yml'
      - '.github/actions/susfs-patches/action.yml'
      - '.github/actions/susfs-revert-patches/action.yml'
      - '.github/scripts/susfs_namespace_header.py'

permissions:
  contents: read
  actions: read

jobs:
  module:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: modules/houji-experience
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v7
      - name: Download this kernel's build metadata
        if: inputs.kernel_artifact_name != '' && inputs.kernel_artifact_name != null
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.kernel_artifact_name }}
          path: ${{ runner.temp }}/houji-kernel-artifact
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install pinned frontend tools
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Test backend and scripts
        run: |
          go test -race ./...
          go vet ./...
          for script in ./*.sh tools/*.sh; do bash -n "$script"; done
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck -s sh customize.sh service.sh uninstall.sh
          shellcheck tools/build-android.sh
      - name: Build and test WebUI
        run: |
          pnpm build
          pnpm test
          pnpm exec playwright install --with-deps chromium
          pnpm test:browser
      - name: Build Android arm64 with Bionic DNS
        env:
          KERNEL_ARTIFACT: ${{ inputs.kernel_artifact_name }}
          KERNEL_MANIFEST: ${{ runner.temp }}/houji-kernel-artifact/houji-kernel.json
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;28.1.13356709'
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.1.13356709" bash tools/build-android.sh
          python3 tools/collect-licenses.py
          if [ -n "$KERNEL_ARTIFACT" ]; then
            python3 tools/package.py --kernel-manifest "$KERNEL_MANIFEST" --kernel-artifact "$KERNEL_ARTIFACT" --kernel-image "$(dirname "$KERNEL_MANIFEST")/Image"
          else
            python3 tools/package.py
          fi
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Upload preview module and checksums
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name || 'HNHouji-Experience-preview' }}
          path: |
            modules/houji-experience/dist/*.zip
            modules/houji-experience/dist/*.sha256
            modules/houji-experience/dist/*.manifest.json
          if-no-files-found: error
      - name: Upload browser QA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name || 'HNHouji-Experience-preview' }}-webui-qa
          path: |
            modules/houji-experience/dist/screenshots/
            modules/houji-experience/test-results/
          if-no-files-found: ignore

name: 'Setup Misc Configs'
description: 'Set up kernel configuration fragment with miscellaneous options'
inputs:
  version:
    description: 'Kernel config version (e.g., android14-6.12)'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 6.1)'
    required: true
  android_version:
    description: 'Android version (e.g., android14)'
    required: true
  sublevel:
    description: 'Sublevel of kernel version (e.g., 1)'
    required: true
  variant:
    description: 'Build variant (Normal, Bypass, Wild, boot-time)'
    required: true
  preserve_zram_defaults:
    description: 'Keep the ACK ZRAM configuration for the houji LTS baseline'
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Enable Kernel Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_MQ_IOSCHED_DEADLINE=y
          CONFIG_F2FS_FS_COMPRESSION=y
          CONFIG_EXFAT_FS=y
          CONFIG_VFAT_FS=y
          CONFIG_PSTORE=y
          CONFIG_PSTORE_CONSOLE=y
          CONFIG_PSTORE_RAM=y
          CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y

    - name: Enable optional ZRAM settings
      if: inputs.preserve_zram_defaults != 'true'
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_ZRAM_DEF_COMP_LZ4=y
          CONFIG_ZRAM_WRITEBACK=y
          CONFIG_ZRAM_MEMORY_TRACKING=y
